<svg xmlns="http://www.w3.org/2000/svg" viewBox="59.18 55 288.09 85">
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Gentle arc -->
  <defs>
    <path id="arcPath" d="M50 130 Q200 80 350 130" fill="none"/>
  </defs>

  <!-- Text -->
  <text font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-style="italic" font-weight="600" font-size="52" fill="#FFE678" stroke="rgba(0,0,0,0.85)" stroke-width="4" paint-order="stroke fill" text-anchor="middle">
    <textPath href="#arcPath" startOffset="50%">
      SCENEIFY
    </textPath>
  </text>

  <!-- Bottom-left flash (touching text) -->
  <g fill="#FFE678" transform="translate(125,120) scale(0.8)">
    <polygon points="5,0 10,8 20,8 12,14 15,25 7,18 0,20 4,12" stroke="rgba(0,0,0,0.85)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill"/>
  </g>

  <!-- Top-right flash (moved higher) -->
  <g fill="#FFE678" transform="translate(305,55) scale(0.8)">
    <polygon points="5,0 10,8 20,8 12,14 15,25 7,18 0,20 4,12" stroke="rgba(0,0,0,0.85)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill"/>
  </g>
</svg>